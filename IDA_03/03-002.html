<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Test</title>
    <script>
        //canvasの中身を示すもの
        let ctx;
        //canvasのwidth 幅
        let cw;
        //canvasのheight 高さ
        let ch;

        //初期化処理
        function init() {
            //IDがmycanvasのものをcanvasという変数にいれておく
            let canvas = document.getElementById("mycanvas");
            //canvasが存在しないか、canvasの中身がなければ処理終了
            if(!canvas ||!canvas.getContext){
                return false;
            }

            //canvasの中身を指し示すものを代入
            ctx = canvas.getContext("2d");
            //canvasの幅・高さを代入しておく
            cw = canvas.width;
            ch = canvas.height;

            //実際の描画処理
            draw();
        }

        function draw() {
            //塗の色を設定
            ctx.fillStyle = "rgba(255,0,0,1)";

            //長方形の描画
            ctx.fillRect(10,10,50,50); //左上のx,y 座標,幅,高さ
        }
    </script>
</head>
<body onload="init();">
    <h1>Canvas Test</h1>
    <canvas id="mycanvas" width="1000" height="800"></canvas>
</body>
</html>
