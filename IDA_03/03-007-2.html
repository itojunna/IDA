<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Test</title>
    <script>
        //canvasの中身を示すもの
        let ctx;
        //canvasのwidth 幅
        let cw;
        //canvasのheight 高さ
        let ch;

        //初期化処理
        function init() {
            //IDがmycanvasのものをcanvasという変数にいれておく
            let canvas = document.getElementById("mycanvas");
            //canvasが存在しないか、canvasの中身がなければ処理終了
            if(!canvas ||!canvas.getContext){
                return false;
            }

            //canvasの中身を指し示すものを代入
            ctx = canvas.getContext("2d");
            //canvasの幅・高さを代入しておく
            cw = canvas.width;
            ch = canvas.height;
            //全体の透明度を設定
            ctx.globalAlpha = 0.5;

            //実際の描画処理
            draw();

            //一定時間ごとに書き換える
            setInterval("draw()",200);
        }

        function draw() {
            //画面をリセットする
            ctx.fillStyle = "rgba(255,255,255,0.3)";
            ctx.fillRect(0,0,cw,ch);
            
            ctx.strokeStyle = "rgba("+getRandomColor()+","+getRandomColor()+","+getRandomColor()+","+getRandomAlpha()+")";
            //塗の色を設定
            ctx.fillStyle = "rgba("+getRandomColor()+","+getRandomColor()+","+getRandomColor()+","+getRandomAlpha()+")";

            let type = getRandomNum(3);
            console.log(type); 

            //長方形の描画
            if(type == 0){
                ctx.fillRect(getRandomNum(cw),getRandomNum(ch),getRandomNum(cw),getRandomNum(ch));
            }

            if(type == 1){
                ctx.beginPath();
                ctx.moveTo(getRandomNum(cw),getRandomNum(ch));
                ctx.lineTo(getRandomNum(cw),getRandomNum(ch));
                ctx.stroke();
            }

            if(type == 2){
                ctx.beginPath();
                ctx.arc(getRandomNum(cw),getRandomNum(ch),getRandomNum(cw/2),0,360/180*Math.PI,true);
                ctx.stroke();
            }
        }

            //ランダムな数値を返す
            function getRandomNum(num){
                return Math.floor(Math.random()*num);
        }
            function getRandomColor(){
                return Math.floor(Math.random()*255);
        }
            function getRandomAlpha(){
                return Math.random();
        }

    </script>
</head>
<body onload="init();">
    <h1>Canvas Test</h1>
    <canvas id="mycanvas" width="1000" height="800"></canvas>
</body>
</html>
