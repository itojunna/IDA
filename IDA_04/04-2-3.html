<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Test</title>
    <script>
        //canvasの中身を示すもの
        let ctx;
        //canvasのwidth 幅
        let cw;
        //canvasのheight 高さ
        let ch;

        //パーティクルの準備
        const distance = 100; //パーティクルの密度
        let particles = []; //パーティクルの配列

        //初期化処理
        function init() {
            //ID がmycanvasのものをcanvasという変数にいれておく
            let canvas = document.getElementById("mycanvas");
            //canvasが存在しないか、canvasの中身がなければ処理終了
            if(!canvas ||!canvas.getContext){
                return false;
            }

            //canvasの中身を指し示すものを代入
            ctx = canvas.getContext("2d");
            //canvasの幅・高さを代入しておく
            cw = canvas.width;
            ch = canvas.height;

            //円の初期化
            for(let i=0; i<distance; i++){
                particles[i] = new Particle(6, "rgba("+getRandomColor()+","+getRandomColor()+","+getRandomColor()+","+getRandomAlpha()+")", Math.random()*(4-2)+2);
                particles[i].position.y = Math.random()*ch;
                particles[i].position.x = Math.random()*cw;
                particles[i].draw();
            }

            //実際の描画処理
            draw();

            //一定時間ごとに書き換える 30fpsにするために1000msec/30=33msec
            setInterval("draw()", 33);
        }

        //Particle クラス
        class Particle {
            constructor(scale, color, speed) {
                this.scale = scale;
                this.color = color;
                this.speed = speed;
                this.position = {
                    x: 100,
                    y: 100
                };
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.position.x, this.position.y, this.scale, 0, 2*Math.PI, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function draw() {
            //画面をリセットする
            ctx.fillStyle = "rgba(255,255,255,1)";
            ctx.fillRect(0,0,cw,ch);

            //円の描画
            for(let i=0; i<distance; i++){
                particles[i].position.x += particles[i].speed;
                particles[i].draw();

                if(particles[i].position.x > cw) particles[i].position.x -= cw;
            }
        }

        function getRandomColor() {
            return Math.floor(Math.random() * 255);
        }
        function getRandomAlpha() {
            return Math.random();
        }
    </script>
</head>
<body onload="init()">
    <h1>Canvas Test</h1>
    <canvas id="mycanvas" width="1000" height="800"></canvas>
</body>
</html>
