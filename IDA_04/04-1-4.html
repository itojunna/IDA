<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Test</title>
    <script>
        //canvasの中身を示すもの
        let ctx;
        //canvasのwidth 幅
        let cw;
        //canvasのheight 高さ
        let ch;

        //移動速度
        const speed = 20;
        let x = 0;
        const target_X = 400;

        //初期化処理
        function init() {
            //ID がmycanvasのものをcanvasという変数にいれておく
            let canvas = document.getElementById("mycanvas");
            //canvasが存在しないか、canvasの中身がなければ処理終了
            if(!canvas ||!canvas.getContext){
                return false;
            }

            //canvasの中身を指し示すものを代入
            ctx = canvas.getContext("2d");
            //canvasの幅・高さを代入しておく
            cw = canvas.width;
            ch = canvas.height;

            //実際の描画処理
            draw();

            //一定時間ごとに書き換える 30fpsにするために1000msec/30=33msec
            setInterval("draw()", 33);
        }

        function draw() {
            //画面をリセットする
            ctx.fillStyle = "rgba(255,255,255,1)";
            ctx.fillRect(0,0,cw,ch);

            //円の描画
            x += (target_X - x) / speed;
            drawCircle(x, 100, 20, "#FF0000");
        }

        function drawCircle(x, y, scale, color) {
            //円の描画
            ctx.beginPath();
            ctx.arc(x, y, scale, 0, 2*Math.PI, false);
            ctx.fillStyle = color;
            ctx.fill();
        }
    </script>
</head>
<body onload="init()">
    <h1>Canvas Test</h1>
    <canvas id="mycanvas" width="1000" height="800"></canvas>
</body>
</html>
