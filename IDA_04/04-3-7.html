<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let ctx;
        let cw;
        let ch;

        //パーティクルの準備
        const distance = 100; 
        let particles = []; 

        const distance_line = 10;
        let lines = [];

        const distance_tri = 10;
        let tris = [];

        //【演出管理用の変数】
        let mode = "EXPLODE";   //現在の状態：EXPLODE（爆発）/SLOW（スロー）/RETURN（戻る）
        let timeScale = 1.0;    //時間の流れ/速さ倍率
        let timer = 0;          //タイマー
        let centerX;            //爆発・吸引の中心X
        let centerY;            //爆発・吸引の中心Y

        //初期化処理
        function init() {
            let canvas = document.getElementById("mycanvas");
            if(!canvas || !canvas.getContext){
                return false;
            }

            ctx = canvas.getContext("2d");
            cw = canvas.width;
            ch = canvas.height;

            //中心点を設定
            centerX = cw/2;
            centerY = ch/2;

            //エフェクトを生成・配置する関数
            resetAllEffects();

            //実際の描画処理
            draw();

            //一定時間ごとに書き換える
            setInterval(draw, 33);
        }

        //図形を中央に配置して速度をランダムにするリセット関数
        function resetAllEffects() {
            //円の初期化（重力gv:0/位置を中心:centerX/centerY）
            for(let i=0; i<distance; i++){
                particles[i] = new Particle(getRandomScale(),"rgba("+getRandomColor()+","+getRandomColor()+","+getRandomColor()+","+getRandomAlpha()+")", getRandomVelocity(), getRandomVelocity(), 0);
                particles[i].position.x = centerX;
                particles[i].position.y = centerY;
            }
            //線の初期化（すべての端点を中央に集める）
            for(let j=0; j<distance_line; j++){
                lines[j] = new Line(centerX, centerY, getRandomVelocity(), getRandomVelocity(), centerX, centerY, getRandomVelocity(), getRandomVelocity(), "rgba("+getRandomColor()+","+getRandomColor()+","+getRandomColor()+","+getRandomAlpha()+")", getRandomLineWidth(), 0);
            }
            //三角形の初期化（すべての頂点を中央に集める）
            for(let k=0; k<distance_tri; k++){
                tris[k] = new Tri(centerX, centerY, getRandomVelocity(), getRandomVelocity(), centerX, centerY, getRandomVelocity(), getRandomVelocity(), centerX, centerY, getRandomVelocity(), getRandomVelocity(), "rgba("+getRandomColor()+","+getRandomColor()+","+getRandomColor()+","+getRandomAlpha()+")", getRandomLineWidth(), 0);
            }
        }

        //Particle クラス
        class Particle {
            constructor(scale, color, vx, vy, gv) {
                this.scale = scale;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.gv = gv;
                this.position = { x: 100, y: 100 };
            }
            draw(){
                ctx.beginPath();
                ctx.arc(this.position.x, this.position.y, this.scale, 0, 2*Math.PI, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update(){
                this.vy += this.gv;

                //中心へ向かって引き合う速度に書き換える
                if (mode === "RETURN") {
                    this.vx = (centerX - this.position.x) * 0.2;
                    this.vy = (centerY - this.position.y) * 0.2;
                }

                //速度にタイムスケール（時間の倍率）を掛けて座標を動かす
                this.position.x += this.vx * timeScale;
                this.position.y += this.vy * timeScale;
                this.draw();
            }
        }

        // Line クラス
        class Line {
            constructor(x1, y1, vx1, vy1, x2, y2, vx2, vy2, color, width, gv) {
                this.position1 = {x:x1, y:y1};
                this.v1 = {x:vx1, y:vy1};
                this.position2 = {x:x2, y:y2};
                this.v2 = {x:vx2, y:vy2};
                this.color = color;
                this.width = width;
                this.gv = gv;
            }
            draw(){
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.width;
                ctx.beginPath();
                ctx.moveTo(this.position1.x, this.position1.y);
                ctx.lineTo(this.position2.x, this.position2.y);
                ctx.stroke();
            }
            update(){
                this.v1.y += this.gv;
                this.v2.y += this.gv;

                //戻るモードの処理
                if (mode === "RETURN") {
                    this.v1.x = (centerX - this.position1.x) * 0.2;
                    this.v1.y = (centerY - this.position1.y) * 0.2;
                    this.v2.x = (centerX - this.position2.x) * 0.2;
                    this.v2.y = (centerY - this.position2.y) * 0.2;
                }

                this.position1.x += this.v1.x * timeScale;
                this.position1.y += this.v1.y * timeScale;
                this.position2.x += this.v2.x * timeScale;
                this.position2.y += this.v2.y * timeScale;
                this.draw();
            }
        }

        // Tri クラス
        class Tri {
            constructor(x1, y1, vx1, vy1, x2, y2, vx2, vy2, x3, y3, vx3, vy3, color, width, gv) {
                this.position1 = {x:x1, y:y1};
                this.v1 = {x:vx1, y:vy1};
                this.position2 = {x:x2, y:y2};
                this.v2 = {x:vx2, y:vy2};
                this.position3 = {x:x3, y:y3};
                this.v3 = {x:vx3, y:vy3};
                this.color = color;
                this.width = width;
                this.gv = gv;
            }
            draw(){
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.width;
                ctx.beginPath();
                ctx.moveTo(this.position1.x, this.position1.y);
                ctx.lineTo(this.position2.x, this.position2.y);
                ctx.lineTo(this.position3.x, this.position3.y);
                ctx.lineTo(this.position1.x, this.position1.y);
                ctx.stroke();
            }
            update(){
                this.v1.y += this.gv;
                this.v2.y += this.gv;
                this.v3.y += this.gv;

                //戻るモードの処理
                if (mode === "RETURN") {
                    this.v1.x = (centerX - this.position1.x) * 0.2;
                    this.v1.y = (centerY - this.position1.y) * 0.2;
                    this.v2.x = (centerX - this.position2.x) * 0.2;
                    this.v2.y = (centerY - this.position2.y) * 0.2;
                    this.v3.x = (centerX - this.position3.x) * 0.2;
                    this.v3.y = (centerY - this.position3.y) * 0.2;
                }

                this.position1.x += this.v1.x * timeScale;
                this.position1.y += this.v1.y * timeScale;
                this.position2.x += this.v2.x * timeScale;
                this.position2.y += this.v2.y * timeScale;
                this.position3.x += this.v3.x * timeScale;
                this.position3.y += this.v3.y * timeScale;
                this.draw();
            }
        }

        //ループ
        function draw() {
            // 画面をリセットする
            ctx.fillStyle = "rgba(255,255,255,1)";
            ctx.fillRect(0,0,cw,ch);

            //【時間と演出状態のコントロール】
            if (mode === "EXPLODE") {
                //爆発中：だんだんスローモーションにする
                timeScale -= 0.04; 
                if (timeScale <= 0.02) {
                    timeScale = 0.02; //完全に止めずにごくわずかに動かす演出
                    mode = "SLOW";
                    timer = 0;
                }
            } 
            else if (mode === "SLOW") {
                // 2.スロー中：しばらくその場でじわっと滞留させる
                timer++;
                if (timer > 20) {
                    mode = "RETURN";
                    timeScale = 1.8;
                    //3.戻るときは高速にする
                    timer = 0;
                }
            } 
            else if (mode === "RETURN") {
                // 4.戻り中:ある程度中心に集まる時間を待ったら、再度新しく爆発させる
                timer++;
                if (timer > 25) {
                    mode = "EXPLODE";
                    timeScale = 1.0; //スピードを通常に戻す
                    resetAllEffects(); //次の爆発のために位置と速度をシャッフル
                }
            }

            // 円の描画
            for(let i=0; i<distance; i++){
                particles[i].update();
            }

            // 線の描画
            for(let j=0; j<distance_line; j++){
                lines[j].update();
            }

            // 三角形の描画
            for(let k=0; k<distance_tri; k++){
                tris[k].update();
            }
        }

        function getRandomColor() {
            return Math.floor(Math.random()*255);
        }
        function getRandomAlpha() {
            return Math.random();
        }
        function getRandomScale() {
            return (Math.random()*(8-3))+3;
        }
        function getRandomLineWidth() {
            return Math.random()*5;
        }
        function getRandomVelocity() {
            return Math.random()*30-15; 
        }
    </script>
</head>
<body onload="init()">
    <h1>Document</h1>
    <canvas id="mycanvas" width="1000" height="900"></canvas>
</body>
</html>
