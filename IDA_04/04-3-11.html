<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/three@0.137.4/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.137.4/examples/js/utils/BufferGeometryUtils.js"></script>
    <script src="https://unpkg.com/stats.js@0.17.0/build/stats.min.js"></script>
    <title>Particle演習</title>
    <script>
        //ページの読み込みを待つ
        window.addEventListener("DOMContentLoaded", init);

        function init() {
            //サイズを指定
            const width = 960;
            const height = 540;

            //レンダラーを作成
            const renderer = new THREE.WebGLRenderer({
                canvas: document.querySelector("#mycanvas")
            });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(width, height);

            //シーンを作成
            const scene = new THREE.Scene();

            //カメラを作成
            const camera = new THREE.PerspectiveCamera(45, width / height);
            camera.position.set(0, 0, +1000);

            //格子状に配置
            const CELL_NUM = 20; //縦横の数
            const interval = 10; //間隔
            const boxArray = []; 
            const velocityArray = []; 
            const rotationArray = [];

            //箱をたくさん作って並べる（薄い正方形の板状にする）
            const geometry = new THREE.BoxGeometry(15, 15, 1);
            
            for (let i = 0; i < CELL_NUM; i++) {
                for (let j = 0; j < CELL_NUM; j++) {
                    const material = new THREE.MeshNormalMaterial();
                    const box = new THREE.Mesh(geometry, material);

                    //初期位置をタイル状に並べる
                    box.position.x = (i - CELL_NUM / 2) * interval;
                    box.position.y = (j - CELL_NUM / 2) * interval;
                    box.position.z = 0;

                    scene.add(box);
                    boxArray.push(box);

                    //散らばる向きとスピードをランダムに持たせる
                    velocityArray.push({
                        x: (Math.random() - 0.5) * 20,
                        y: (Math.random() - 0.5) * 20,
                        z: (Math.random() - 0.5) * 20
                    });

                    //回転のスピード
                    rotationArray.push({
                        x: (Math.random() - 0.5) * 0.3,
                        y: (Math.random() - 0.5) * 0.3,
                        z: (Math.random() - 0.5) * 0.3
                    });
                }
            }

            //フレームレートの数値を画面に表示
            const stats = new Stats();
            stats.domElement.style.position = "absolute";
            stats.domElement.style.top = "10px";
            document.body.appendChild(stats.domElement);

            //タイマー用の変数
            let timer = 0;
            const timer_max = 80;

            //アニメーションループ関数
            function tick() {
                requestAnimationFrame(tick);

                //時間をカウント
                timer++;

                //一定時間（timer_max）を過ぎたら、散らばる動きを開始する
                if (timer > timer_max) {
                    for (let i = 0; i < boxArray.length; i++) {
                        boxArray[i].position.x += velocityArray[i].x;
                        boxArray[i].position.y += velocityArray[i].y;
                        boxArray[i].position.z += velocityArray[i].z;

                        boxArray[i].rotation.x += rotationArray[i].x;
                        boxArray[i].rotation.y += rotationArray[i].y;
                        boxArray[i].rotation.z += rotationArray[i].z;
                    }
                }
                //レンダリング
                renderer.render(scene, camera);

                //レンダリング情報を画面に表示
                document.getElementById("info").innerHTML= JSON.stringify(renderer.info.render, " ", " ");

                //フレームレートを表示
                stats.update();

                requestAnimationFrame(tick);
            }
            tick();
        }
    </script>
</head>
<body>
    <h1>Particle演習</h1>
    <canvas id="mycanvas"></canvas>
</body>
</html>
