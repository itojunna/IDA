<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指の開閉で出現・消滅するAR立方体</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
        }
        /*カメラ映像と3Dcanvasを重ね合わせるコンテナ*/
        #container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            background: #000;
        }
        /*カメラ映像*/
        #video {
            transform: scaleX(-1); /*左右反転*/
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            left: 0;
            top: 0;
            display: block;
        }
        /*3D描画用のcanvas*/
        #three-canvas {
            transform: scaleX(-1); /*映像の反転に合わせる*/
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /*マウス操作を背面に透過させる*/
        }
        .info {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
        }
    </style>

    <!--Three.jsの読み込み-->
    <script src="https://unpkg.com/three@0.137.4/build/three.min.js"></script>
    
    <!--MediaPipe Hands & Camera Utilsの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>

    <!--1つにまとめた画面コンテナ-->
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="three-canvas"></canvas>
    </div>

    <div class="info">
        💡 親指と人差し指を離すと立方体が出現して指の間についてきます。<br>指をくっつけると収縮して消えます。
    </div>

    <script>
        const width = 640;
        const height = 480;

        //---Three.js の初期設定（背景を透明に設定）---
        const canvasElement = document.querySelector("#three-canvas");
        const renderer = new THREE.WebGLRenderer({
            canvas: canvasElement,
            alpha: true, //背景を透明にしてカメラ映像を透けさせる
            antialias: true
        });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(width, height);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 1, 1000);
        camera.position.set(0, 0, 800);

        //立方体を作成
        const geometry = new THREE.BoxGeometry(180, 180, 180);
        const material = new THREE.MeshNormalMaterial();
        const box = new THREE.Mesh(geometry, material);
        scene.add(box);

        let targetScale = 0.0; //初期状態は非表示（サイズ0）

        //---基礎コードベースのカメラ取得---
        var video = document.getElementById("video");
        var media = navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
        });
        media.then((stream) => {
            video.srcObject = stream;
        }).catch((err) => {
            console.error("カメラの取得に失敗しました:", err);
        });

        //---MediaPipe Hands による指先認識と追従---
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, //軽快に動作させるための軽量設定
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                //親指の先端 (4番)と人差し指の先端 (8番) の座標を取得
                const thumb = landmarks[4];
                const index = landmarks[8];

                //2点間の距離を計算
                const distance = Math.sqrt(
                    Math.pow(thumb.x - index.x, 2) +
                    Math.pow(thumb.y - index.y, 2) +
                    Math.pow(thumb.z - index.z, 2)
                );

                //指をくっつけている時はサイズ0（消える）、離すと大きくなる
                if (distance < 0.05) {
                    targetScale = 0.0;
                } else {
                    targetScale = Math.min((distance - 0.05) * 4.0, 1.0);
                }

                //立方体の位置を「親指と人差し指の中点」に移動させる
                const centerX = ((thumb.x + index.x) / 2 - 0.5) * -width;
                const centerY = ((thumb.y + index.y) / 2 - 0.5) * -height;
                box.position.set(centerX, centerY, 0);

            } else {
                //手が映っていないときは消す
                targetScale = 0.0;
            }
        });

        //カメラフレームをMediaPipeに流すループ
        const cameraUtils = new Camera(video, {
            onFrame: async () => {
                if (video.paused || video.ended) return;
                await hands.send({ image: video });
            },
            width: width,
            height: height
        });
        cameraUtils.start();

        //---毎フレームの描画ループ---
        function tick() {
            requestAnimationFrame(tick);

            //スケールをなめらかに変化させる（イージング）
            box.scale.x += (targetScale - box.scale.x) * 0.15;
            box.scale.y += (targetScale - box.scale.y) * 0.15;
            box.scale.z += (targetScale - box.scale.z) * 0.15;

            //キューブを回転させる
            box.rotation.y += 0.015;
            box.rotation.x += 0.008;

            renderer.render(scene, camera);
        }

        tick();
    </script>
</body>
</html>
